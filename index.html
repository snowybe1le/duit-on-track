<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>DuitOnTrack — Your AI Money Coach</title>
  <link rel="stylesheet" href="css/style.css" />
  <link rel="stylesheet" href="css/pages.css" />
  <link rel="stylesheet" href="css/auth.css" />
</head>
<body class="texture-bg">

<!-- Navigation -->
<nav class="nav" id="main-nav">
  <div class="nav-inner">
    <div class="nav-logo">
      Duit<span>OnTrack</span>
    </div>
    <div class="nav-links" id="nav-auth-links">
      <!-- Public nav -->
      <div id="nav-public">
        <button class="btn btn-ghost btn-sm" onclick="showAuthModal('login')">Log in</button>
        <button class="btn btn-primary btn-sm" onclick="showAuthModal('register')" style="margin-left:6px;">Get started →</button>
      </div>
      <!-- Authenticated nav (hidden by default) -->
      <div id="nav-app" style="display:none;align-items:center;gap:6px;">
        <button class="nav-link" data-page="dashboard">Dashboard</button>
        <button class="nav-link" data-page="chat">Coach AI</button>
        <div class="nav-user-wrap">
          <button class="nav-user-btn" id="nav-user-btn">
            <div class="nav-av" id="nav-av">A</div>
            <span id="nav-username">Aina</span>
            <span style="font-size:10px;color:var(--bark);">▾</span>
          </button>
          <div class="nav-dropdown" id="nav-dropdown">
            <button onclick="handleLogout()"> Log out</button>
          </div>
        </div>
      </div>
    </div>
  </div>
</nav>

<!--AUTH MODAL -->
<div id="auth-overlay" class="auth-overlay" style="display:none;">
  <div class="auth-modal">
    <button class="auth-close" onclick="closeAuthModal()">✕</button>

    <!-- LOGIN PANEL -->
    <div id="auth-login" class="auth-panel">
      <div class="auth-logo">🪙 DuitOnTrack</div>
      <h2 class="auth-title">Welcome back</h2>
      <p class="auth-sub">Log in to continue your savings journey</p>
